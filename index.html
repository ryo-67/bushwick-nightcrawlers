<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Bushwick Nightcrawlers</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://unpkg.com/tone@15.1.22/build/Tone.js" defer></script>
</head>
<body>
  <aside class="headphones-tag" role="note">
    Headphones recommended. This is a sound piece.
  </aside>

  <main>
    <div class="map-wrapper">
      <video class="map-bg" autoplay loop muted playsinline aria-hidden="true">
        <source src="assets/map.mp4" type="video/mp4">
      </video>
      <div class="pin-layer">
        <div class="pin" data-pin-id="market-hotel" aria-label="Market Hotel"></div>
        <div class="pin" data-pin-id="mr-kiwi" aria-label="Mr. Kiwi"></div>
        <div class="pin" data-pin-id="trifecta" aria-label="The Trifecta"></div>
        <div class="pin" data-pin-id="jmz-platform" aria-label="JMZ platform"></div>
        <div class="pin" data-pin-id="alley" aria-label="The alley"></div>
        <div class="pin" data-pin-id="rash" aria-label="Rash (closed)"></div>
        <div class="pin" data-pin-id="ornithology" aria-label="Ornithology"></div>
        <div class="pin" data-pin-id="mood-ring" aria-label="Mood Ring"></div>
        <div class="pin" data-pin-id="bossa-nova" aria-label="Bossa Nova Civic Club"></div>
        <div class="pin" data-pin-id="caffeine-underground" aria-label="Caffeine Underground"></div>
      </div>
    </div>
  </main>

  <div class="modal" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="modal-rat-name">
    <div class="modal-card">
      <button class="modal-close" type="button" aria-label="Close review">&times;</button>

      <div class="venue-photo" aria-hidden="true"></div>

      <header class="modal-header">
        <div class="rat-selfie" aria-hidden="true"></div>
        <div class="rat-meta">
          <h2 id="modal-rat-name" class="rat-name"></h2>
          <p class="rat-handle"></p>
        </div>
      </header>

      <div class="venue-meta">
        <h3 class="venue-name"></h3>
        <div class="star-rating" aria-label="Star rating">
          <span class="star"></span>
          <span class="star"></span>
          <span class="star"></span>
          <span class="star"></span>
          <span class="star"></span>
        </div>
      </div>

      <canvas class="oscilloscope" width="640" height="120" aria-hidden="true"></canvas>

      <div class="subtitles" aria-live="polite"></div>

      <button class="play-button" type="button">Play</button>
    </div>
  </div>

  <footer>
    <a href="about.html">About</a>
  </footer>
</body>
</html>
