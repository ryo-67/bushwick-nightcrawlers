<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Bushwick Nightcrawlers</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://unpkg.com/tone@15.1.22/build/Tone.js"></script>
  <script type="module" src="src/main.js"></script>
</head>
<body>
  <main>
    <div class="map-wrapper" role="region" aria-label="Map of Myrtle and Broadway intersection. Click pins to hear rat reviews of each venue.">
      <video class="map-bg" autoplay loop muted playsinline aria-hidden="true">
        <source src="assets/map.mp4" type="video/mp4">
      </video>
      <!-- Pin tab order matches the venue declaration order in src/content/venues.js. -->
      <div class="pin-layer">
        <div class="pin" data-pin-id="market-hotel"         role="button" tabindex="0" aria-label="Market Hotel"><img src="assets/pins/market-hotel.webp" width="100" height="100" alt=""></div>
        <div class="pin" data-pin-id="mr-kiwi"              role="button" tabindex="0" aria-label="Mr. Kiwi"><img src="assets/pins/mr-kiwi.webp" width="100" height="100" alt=""></div>
        <div class="pin" data-pin-id="trifecta"             role="button" tabindex="0" aria-label="The Trifecta"><img src="assets/pins/trifecta.webp" width="100" height="100" alt=""></div>
        <div class="pin" data-pin-id="jmz-platform"         role="button" tabindex="0" aria-label="JMZ platform"><img src="assets/pins/jmz-platform.webp" width="100" height="100" alt=""></div>
        <div class="pin" data-pin-id="alley"                role="button" tabindex="0" aria-label="alley between Mr Kiwi and JMZ (ambient only)"><img src="assets/pins/alley.webp" width="100" height="100" alt=""></div>
        <div class="pin" data-pin-id="rash"                 role="button" tabindex="0" aria-label="Rash (closed February 2026)"><img src="assets/pins/rash.webp" width="100" height="100" alt=""></div>
        <div class="pin" data-pin-id="ornithology"          role="button" tabindex="0" aria-label="Ornithology Jazz Club"><img src="assets/pins/ornithology.webp" width="100" height="100" alt=""></div>
        <div class="pin" data-pin-id="mood-ring"            role="button" tabindex="0" aria-label="Mood Ring"><img src="assets/pins/mood-ring.webp" width="100" height="100" alt=""></div>
        <div class="pin" data-pin-id="bossa-nova"           role="button" tabindex="0" aria-label="Bossa Nova Civic Club"><img src="assets/pins/bossa-nova.webp" width="100" height="100" alt=""></div>
        <div class="pin" data-pin-id="caffeine-underground" role="button" tabindex="0" aria-label="Caffeine Underground"><img src="assets/pins/caffeine-underground.webp" width="100" height="100" alt=""></div>
      </div>
    </div>
  </main>

  <div id="modal-root" class="modal" role="dialog" aria-modal="true" aria-hidden="true" data-state="closed"></div>

  <footer>
    <a href="about.html">About</a>
    <span class="footer-divider" aria-hidden="true">·</span>
    <span class="footer-mode-set">
      <span class="footer-mode-prefix">the rats speak:</span>
      <button type="button" class="footer-mode" data-mode="moment" aria-pressed="false">in the moment</button>
      <span class="footer-mode-pipe" aria-hidden="true">|</span>
      <button type="button" class="footer-mode" data-mode="record" aria-pressed="false">on record</button>
    </span>
    <span class="footer-divider" aria-hidden="true">·</span>
    <span class="footer-audio-set">
      <input type="range" class="footer-volume" min="-40" max="0" step="1" value="0" aria-label="Master volume">
      <button type="button" class="footer-mute" aria-pressed="false" aria-label="Mute audio">
        <svg viewBox="0 0 18 24" width="14" height="18" aria-hidden="true">
          <path d="M2 9h3l4-3v12l-4-3H2z" fill="currentColor"/>
          <path class="footer-mute-bars" d="M11 9h2 M11 12h3 M11 15h2" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round"/>
          <path class="footer-mute-x" d="M11 9l4 6 M15 9l-4 6" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round"/>
        </svg>
      </button>
    </span>
    <span class="footer-divider" aria-hidden="true">·</span>
    <button type="button" class="footer-reset" aria-label="Reset experience">forget the rats you've met</button>
  </footer>
</body>
</html>
